<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markus preview</title>
  <link rel="stylesheet" href="/markus.css">
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      background: #1c1914;
      color: #f4efe4;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #3f3a33;
    }
    .bar strong { letter-spacing: 0.08em; text-transform: uppercase; }
    .bar span { color: #b7b0a4; font-size: 0.9rem; }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
    }
    textarea {
      resize: none;
      border: 0;
      padding: 1rem;
      background: #161410;
      color: #f4efe4;
      font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace;
      outline: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4efe4;
    }
    .error { color: #fecdd3; font-size: 0.9rem; }
    @media (max-width: 800px) {
      .split { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <strong>Markus preview</strong>
    <span id="status">Ready</span>
  </div>
  <div class="split">
    <textarea id="source" spellcheck="false"></textarea>
    <iframe id="preview" title="Rendered Markus"></iframe>
  </div>
  <script>
    const initial = /*INITIAL_SOURCE*/;
    const source = document.getElementById("source");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const starter = `# Local inference, laid out with intent

The interesting constraint is not raw model quality. It is latency,
privacy, energy, and operational simplicity.

:::pull-quote{attribution="Engineering principle" tone="primary"}
The best system is often the one whose failure modes you can explain.
:::

:::feature-grid{columns=3}
:::feature-card{icon="bolt"}
## Low latency

Keep common interactions local to minimize round trips.
:::

:::feature-card{icon="lock"}
## Private by default

Do not transmit user data unless the task requires it.
:::

:::feature-card{icon="gauge"}
## Measurable cost

Track tokens, watts, requests, and time-to-result.
:::
:::

:::note{title="Editorial guidance"}
Use \`two-up\` to express a conceptual pairing, not merely because two
paragraphs happen to fit beside each other.
:::
`;
    source.value = initial || starter;
    let timer = null;

    async function render() {
      status.textContent = "Rendering…";
      try {
        const response = await fetch("/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source: source.value }),
        });
        const data = await response.json();
        if (!response.ok) {
          status.className = "error";
          status.textContent = data.error || "Convert failed";
          return;
        }
        status.className = "";
        status.textContent = "Ready";
        const doc = `<!DOCTYPE html><html><head>
          <link rel="stylesheet" href="/markus.css">
          </head><body class="markus-body">${data.html}</body></html>`;
        preview.srcdoc = doc;
      } catch (err) {
        status.className = "error";
        status.textContent = String(err);
      }
    }

    source.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(render, 250);
    });
    render();
  </script>
</body>
</html>
