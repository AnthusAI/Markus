name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Semantic Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.5.1)"
        required: true

permissions:
  contents: read

jobs:
  resolve-tag:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || {
              echo "Tag $tag does not exist." >&2
              exit 1
            }
          else
            tag="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)"
          fi
          echo "Resolved tag: ${tag:-<none>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve-tag
    if: ${{ needs.resolve-tag.outputs.tag != '' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anthus-markus/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
